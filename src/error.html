<!doctype html>
<!-- Shown when even the page frame fails, e.g. the login check in hooks.server.ts while the API restarts. -->
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<title>Fehler %sveltekit.status% – Materialverwaltung</title>
		<style>
			:root {
				color-scheme: light dark;
				--background: #fff;
				--foreground: #09090b;
				--muted: #71717a;
				--button: #18181b;
				--button-text: #fafafa;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: #09090b;
					--foreground: #fafafa;
					--muted: #a1a1aa;
					--button: #e4e4e7;
					--button-text: #18181b;
				}
			}
			body {
				margin: 0;
				padding: 3rem 1rem;
				background: var(--background);
				color: var(--foreground);
				font-family: ui-sans-serif, system-ui, sans-serif;
				text-align: center;
			}
			main {
				max-width: 28rem;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.5rem;
			}
			p {
				color: var(--muted);
				line-height: 1.5;
			}
			button {
				margin-top: 0.5rem;
				padding: 0.5rem 1rem;
				border: 0;
				border-radius: 0.5rem;
				background: var(--button);
				color: var(--button-text);
				font: inherit;
				font-weight: 500;
				cursor: pointer;
			}
			small {
				display: block;
				margin-top: 1.5rem;
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Die Seite konnte nicht geladen werden</h1>
			<p>
				Meist startet der Server gerade neu, etwa nach einem Update. Das dauert nur einen Moment:
				Lade die Seite gleich noch einmal.
			</p>
			<button type="button" onclick="location.reload()">Neu laden</button>
			<small>Fehler %sveltekit.status%: %sveltekit.error.message%</small>
		</main>
	</body>
</html>
